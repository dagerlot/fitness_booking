services:
  db:
    image: postgres:18
    volumes:
      - "dbdata:/var/lib/postgresql"
    env_file: ".db_env"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    env_file: ".web_env"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: