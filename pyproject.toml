[project]
name = "fitness-booking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "django==5.2",
    "django-environ>=0.14.0",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.1.1",
    "pre-commit>=4.6.2",
    "pytest-django[django]>=4.14.0",
    "ruff>=0.16.10",
    "selenium>=4.48.0",
]
prod = [
    "gunicorn>=26.0.0",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "fitness_booking.settings"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not e2e"]
markers = ["e2e: Tests end to end", "smoke: smoke tests"]
testpaths = [
    "tests",
    "fitness_booking/tests"
]

[tool.ruff.lint]
extend-select = [
    "DJ",       # flake8-django
    "E",        # pycodestyle errors
    "F",        # Pyflakes
    "W",        # pycodestyle warnings
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/settings.py" = ["E501", "F403", "F405"]
"**/test_*.py" = ["S101"]
