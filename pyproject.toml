[project]
name = "fitness-booking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "django==5.2",
    "django-environ>=0.14.0",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.1.1",
    "pytest-django[django]>=4.14.0",
    "selenium>=4.48.0",
]
prod = [
    "gunicorn>=26.0.0",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "fitness_booking.settings"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not e2e"]
markers = ["e2e: Tests end to end", "smoke: smoke tests"]
testpaths = [
    "tests",
    "fitness_booking/tests"
]